[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llama-index-memory-geniffy"
version = "0.1.0"
description = "Geniffy for LlamaIndex: a memory of each of your users, for any LlamaIndex agent. A memory block and tools."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Geniffy", email = "ops@geniffy.com" }]
keywords = ["llama-index", "llamaindex", "memory", "agents", "geniffy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["llama-index-core>=0.14,<0.15", "geniffy>=0.1.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://geniffy.com"
Documentation = "https://docs.geniffy.com/integrations/llamaindex"
Repository = "https://github.com/Geniffy/llama-index-memory-geniffy"
Issues = "https://github.com/Geniffy/llama-index-memory-geniffy/issues"

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]

[tool.hatch.build.targets.sdist]
include = ["llama_index/", "tests/", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.memory.geniffy"

[tool.llamahub.class_authors]
GeniffyMemoryBlock = "Geniffy"

[tool.pytest.ini_options]
testpaths = ["tests"]
# LlamaIndex's own agent classes touch pydantic's deprecated attributes when they are built
filterwarnings = ["ignore::DeprecationWarning:inspect"]
